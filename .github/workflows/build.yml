name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller MediaExport.spec

      - name: Create zip
        run: |
          Compress-Archive -Path dist/MediaExport/* -DestinationPath MediaExport.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: MediaExport.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}