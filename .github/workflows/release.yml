name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      # -------- VERSIONING --------

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $build = "{0:D4}" -f ${{ github.run_number }}

          if ($version -match "alpha") { $stage = "alpha" }
          elseif ($version -match "beta") { $stage = "beta" }
          elseif ($version -match "dev") { $stage = "dev" }
          else { $stage = "release" }

          $full = "v$version b$build $stage"

          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "BUILD=$build" >> $env:GITHUB_ENV
          echo "STAGE=$stage" >> $env:GITHUB_ENV
          echo "FULL_VERSION=$full" >> $env:GITHUB_ENV

      # -------- BUILD EXE --------

      - name: Build EXE
        run: |
          pyinstaller main.py --noconsole --name MediaExport --icon assets/icon.ico

      - name: Show build output
        run: dir dist

      # -------- INSTALL INNO SETUP --------

      - name: Install Inno Setup
        run: choco install innosetup -y

      # -------- BUILD INSTALLER --------

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      # -------- RENAME INSTALLER --------

      - name: Rename installer
        shell: pwsh
        run: |
          $version = "${{ env.VERSION }}"
          $build = "${{ env.BUILD }}"
          $stage = "${{ env.STAGE }}"

          if ($stage -eq "release") {
            $name = "MediaExport v$version b$build.exe"
          }
          else {
            $name = "MediaExport v$version-$stage b$build.exe"
          }

          Rename-Item installer/MediaExportSetup.exe $name

      # -------- DEBUG --------

      - name: List installer files
        run: dir installer

      # -------- CREATE RELEASE --------

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MediaExport v${{ env.VERSION }} b${{ env.BUILD }}"
          tag_name: ${{ github.ref_name }}
          files: installer/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}